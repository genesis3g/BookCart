[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bookcart-playwright-tests"
version = "1.0.0"
description = "Automated tests for BookCart using Playwright"
authors = [
    {name = "BookCart QA Team", email = "qa@bookcart.com"}
]
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest-xdist>=3.0.0",  # Para tests paralelos
    "pytest-html>=3.2.0",   # Para reportes HTML
    "pytest-timeout>=2.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "smoke: smoke tests",
    "slow: slow running tests",
    "auth: authentication tests",
    "catalog: catalog tests",
    "orders: order tests",
    "e2e: end-to-end tests",
]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.black]
line-length = 100
target-version = ['py39']
