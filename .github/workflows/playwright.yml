name: Playwright E2E Tests

on:
  push:
    branches: [master, "test/**"]
  pull_request:
    branches: [master]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: YourStrong!Passw0rd
          ACCEPT_EULA: Y
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update -q
          sudo ACCEPT_EULA=Y apt-get install -y -q mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BookCart/ClientApp/package-lock.json

      - name: Initialize database
        run: |
          sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C \
            -Q "CREATE DATABASE BookDB"
          # Strip the first non-SQL line from the schema file before running it
          sed '1d' DBScript/BookDB.txt > /tmp/schema.sql
          sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C -d BookDB \
            -i /tmp/schema.sql
          sqlcmd -S localhost,1433 -U sa -P 'YourStrong!Passw0rd' -C -d BookDB \
            -i DBScript/seed_ci_data.sql

      - name: Publish app (builds Angular + .NET together)
        run: dotnet publish BookCart/BookCart.csproj -c Release -o ./publish

      - name: Start app
        run: dotnet ./publish/BookCart.dll &
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://+:5000
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=BookDB;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False;"

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000 > /dev/null && echo "App ready" && exit 0
            echo "Attempt $i: waiting..."
            sleep 3
          done
          echo "App failed to start in 90 seconds" && exit 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: PlaywrightTests/pyproject.toml

      - name: Install test dependencies
        run: |
          cd PlaywrightTests
          pip install -e ".[dev]"
          playwright install chromium --with-deps

      - name: Run E2E tests
        run: |
          cd PlaywrightTests
          pytest tests/e2e/ -v --tb=short
        env:
          BASE_URL: http://localhost:5000
          HEADLESS: "true"
          TEST_ENV: staging

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: PlaywrightTests/reports/
          retention-days: 7
